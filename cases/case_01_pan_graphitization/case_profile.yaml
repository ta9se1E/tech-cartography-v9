case_id: case_01_pan_graphitization
case_name: PAN系炭素繊維の前駆体・炭化・黒鉛化
theme: PAN前駆体から炭素繊維を得るプロセスと物性（強度・弾性率）の対応
target_user: 炭素繊維前駆体・炭化工程を扱う中小製造業の材料技術者
target_materials:
  - PAN前駆体繊維
  - 酸化繊維（耐炎化繊維）
  - 炭素繊維
  - 黒鉛化繊維
target_processes:
  - 紡糸・前駆体成形
  - 耐炎化（酸化）
  - 炭化
  - 黒鉛化
  - 表面処理（一次確認のみ）
target_properties:
  - 引張強度
  - 弾性率
  - 結晶配向
  - 密度・収率
target_applications:
  - 航空機構造材
  - スポーツ用品
  - 産業用複合材料
seed_keywords:
  - PAN precursor
  - stabilization oxidation
  - carbonization
  - graphitization
  - tensile strength modulus
  - carbon fiber process property
seed_queries:
  - PAN 前駆体 耐炎化 炭化 黒鉛化 強度
  - carbon fiber stabilization carbonization graphitization patent
  - PAN based carbon fiber process property relationship
seed_patent_ids:
  - US4370169
  - US5176959
  - EP0274055
expected_claim_axes:
  - 前駆体組成と紡糸条件
  - 耐炎化温度・時間・雰囲気
  - 炭化・黒鉛化温度プロファイル
  - 強度・弾性率とプロセスパラメータの対応
expected_evidence_types:
  - 特許請求項・実施例
  - 論文（process-property）
  - 公報・技術レポート（一次 URL）
  - Web Signal（候補のみ）
watch_profile_update_policy:
  description: 炭化・黒鉛化の温度帯キーワードを重点化し、樹脂・複合材は縮小
  expand_on: graphitization temperature profile evidence gap
  narrow_on: sizing matrix composite unrelated
  focus_on: PAN stabilization carbonization
fixed_point_observation_policy:
  cadence: weekly
  diff_fields:
    - new_patents
    - claim_map_changes
    - evidence_gap_delta
  scheduler_required: true
  email_digest_required: true
email_digest_policy:
  include_sections:
    - sources_delta
    - top_patents_delta
    - evidence_gaps
    - next_verification_actions
  web_signal_label: candidate_information_only
scheduler_policy:
  default_enabled: false
  dry_run_first: true
  connects_to: watch_profile_and_digest_preview
exclusion_keywords:
  - battery anode
  - graphene only
  - unrelated polymer blend
safety_policy:
  no_fto_judgement: true
  no_infringement_judgement: true
  no_validity_judgement: true
  no_legal_conclusion: true
  no_fake_evidence: true
  web_signal_is_candidate_only: true
