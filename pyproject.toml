[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patentscout-ai-v7"
version = "0.1.0"
description = "Carbon Fiber Evidence Map / Patent Evidence Intelligence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.58.0",
    "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
