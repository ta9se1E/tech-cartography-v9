name: Study Demo CI

on:
  push:
    branches:
      - v9-study-demo
  pull_request:
    branches:
      - v9-study-demo
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: study-demo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .:src
  V9_UI_MODE: simple
  PYTHONDONTWRITEBYTECODE: "1"
  V9_STUDY_DEMO_SEARCH_RUN_ID: study_demo_search_20260705_145711_c06e0a1b
  STREAMLIT_SERVER_HEADLESS: "true"
  DISABLE_EXTERNAL_API: "true"

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip check

      - name: Install headless UI dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Set up gcloud (upload listing only)
        uses: google-github-actions/setup-gcloud@v2

      - name: Run shared CI checks
        run: bash scripts/run_v9_ci_checks.sh
